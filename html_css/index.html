<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            min-height: 100vh;
            background-color: purple;
            display: flex; /* center */
            justify-content: center;
            align-items: center;
            padding: 20px; /* keeps box off edges */
        }
        .content-box {
            background-color: rgba(245, 245, 245, 1.0);
            width: 100%;
            max-width: 1000px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
            margin-top: 0px;
        }
        .search-input {
            width: 100%; /* makes the space it takes up larger sideways */
            border: none;
            border-radius: 8px;
            outline: none;
            background-color: #eee; /* light gray fill */
            padding: 6px 8px;
        }
        .search-wrapper {
            position: relative; /* make it the reference point for the icon */
            flex: 1;
            max-width: 320px;
        }
        .search-icon {
            position: absolute;
            left: 8px;
            top: 30%;
            transform: translateY(-50%); /* vertically centers icon */
            color: #888;
            pointer-events: none; /* clicks pass thru input */
        }
        .bell {
            font-size: 1.2rem;
            cursor: pointer;
            margin-right: 10px; /* space between bell and avatar */

        }
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
            margin-top: 0px;
        }   
        .filter-btn,
        .tab,
        .icon-btn {
            border: none;
            background: transparent;
            cursor: pointer;
            

        }
        .tabs {
            display: flex;
            gap: 8px;

        }
        </style>
    <title>Page</title>
</head>
<body>
    <div class="content-box">
        <header class="top-bar">
            <div class="main-menu">
                <span class="menu">&#9776; Company name</span>
            </div>
            <div class="search-wrapper">
                <span class="search-icon">&#128269;</span>

            <input type="text" class="search-input" placeholder="      Search for anything">
                                    </div>
            
            <div class="user-menu">
                <span class="bell">&#128276;</span>
                <img src="avatar.jpg" alt="user avatar" class="avatar">
                <span class="greeting">Hi, Jane</span>
                <span class="arrow">&#9662;</span>
            </div>
        </header>

        <div class="toolbar">
            <button class="filter-btn">Categories &#9662;</button>
            <div class="tabs">
                <button class="tab active" data-tab="recommended">Recommended</button>
                <button class="tab" data-tab="trending">Trending Games</button>
                <button class="tab" data-tab="new">New Releases</button>
            </div>
        </div>
    </div>
<script>

</script>
</body>
</html>
